<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>加油日記</title>
<style>
:root {
  --page: #f4f3f8; --surface: #fefeff; --sunken: #ecebf3;
  --ink: #17151f; --ink2: #4e4a5c; --muted: #8a8698;
  --hair: rgba(23,21,31,0.10); --grid: #e4e2ec;
  --accent: #5b45c9; --accent-soft: rgba(91,69,201,0.10); --on-accent: #ffffff;
  --weight: #5b45c9; --avg: #e0841a; --shot: #17936b; --level: #17936b;
  --ok: #1a9e6e; --warn: #d98a00; --bad: #d64545;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #121117; --surface: #1c1b23; --sunken: #26252f;
    --ink: #f2f1f6; --ink2: #c6c3d2; --muted: #8f8b9c;
    --hair: rgba(255,255,255,0.11); --grid: #2c2a35;
    --accent: #9d8cf2; --accent-soft: rgba(157,140,242,0.16); --on-accent: #120f1d;
    --weight: #9d8cf2; --avg: #f0a24a; --shot: #4cc79a; --level: #4cc79a;
    --ok: #4cc79a; --warn: #f0b23c; --bad: #f07070;
  }
}
:root[data-theme="dark"] {
  --page: #121117; --surface: #1c1b23; --sunken: #26252f;
  --ink: #f2f1f6; --ink2: #c6c3d2; --muted: #8f8b9c;
  --hair: rgba(255,255,255,0.11); --grid: #2c2a35;
  --accent: #9d8cf2; --accent-soft: rgba(157,140,242,0.16); --on-accent: #120f1d;
  --weight: #9d8cf2; --avg: #f0a24a; --shot: #4cc79a; --level: #4cc79a;
  --ok: #4cc79a; --warn: #f0b23c; --bad: #f07070;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action: manipulation; }
html, body { background: var(--page); }
body { font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background:none; border:none; cursor:pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:baseline; justify-content:space-between; padding: calc(14px + env(safe-area-inset-top)) 16px 8px; }
.topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: .03em; }
.topbar .date { font-size: 12px; color: var(--muted); }
main { flex:1; padding: 4px 14px calc(84px + env(safe-area-inset-bottom)); }
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; display: flex;
  background: var(--surface); border-top: 1px solid var(--hair); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tabbar button { flex:1; padding: 9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size: 11px; color: var(--muted); }
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.on { color: var(--accent); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 14px; font-weight: 700; color: var(--ink2); margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center; }
.card h2 small { font-weight: 500; color: var(--muted); font-size: 12px; }
.big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.big small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.sub { font-size: 13px; color: var(--ink2); }
.muted { color: var(--muted); }
.row { display:flex; gap: 10px; align-items:center; }
.grow { flex:1; }
.between { display:flex; justify-content:space-between; align-items:center; gap: 10px; }
.bar { height: 10px; background: var(--sunken); border-radius: 99px; overflow:hidden; margin: 10px 0 6px; }
.bar > i { display:block; height:100%; background: var(--accent); border-radius: 99px; }
.pill { white-space: nowrap; display:inline-block; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.btn { text-decoration: none; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding: 11px 16px; border-radius: 12px; font-weight: 700;
  background: var(--accent); color: var(--on-accent); font-size: 15px; }
.btn.ghost { background: var(--sunken); color: var(--ink); }
.btn.block { width: 100%; }
.btn.small { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
label.f { display:block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
.in { width: 100%; padding: 11px 12px; border-radius: 11px; border: 1px solid var(--hair); background: var(--sunken); font-size: 16px; }
.in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.chips { display:flex; flex-wrap:wrap; gap: 7px; }
.chip { padding: 8px 12px; border-radius: 99px; background: var(--sunken); font-size: 14px; border: 1px solid transparent; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.chip.sugg { border-style: dashed; border-color: var(--shot); }
.site { padding: 12px 6px; border-radius: 12px; background: var(--sunken); text-align:center; font-size: 13px; border: 1px solid transparent; }
.site b { display:block; font-size: 15px; margin-bottom: 2px; }
.site.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.site.sugg:not(.on) { border: 1px dashed var(--shot); }
.site .ago { font-size: 11px; color: var(--muted); }
.list .item { display:flex; align-items:center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--hair); }
.list .item:first-child { border-top: none; }
.list .item .t { font-size: 12px; color: var(--muted); }
.list .item .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.x { color: var(--muted); font-size: 18px; padding: 4px 8px; }
.stats { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--sunken); border-radius: 12px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .n { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .n small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
canvas.chart { width: 100%; height: 220px; display:block; }
.legend { display:flex; gap: 14px; font-size: 12px; color: var(--ink2); margin-top: 6px; flex-wrap: wrap; }
.legend i { display:inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.counter { display:flex; align-items:center; gap: 8px; }
.counter .n { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 70px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 8px; }
.empty { text-align:center; color: var(--muted); padding: 22px 6px; font-size: 14px; line-height: 1.7; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--page);
  padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events:none; z-index: 50; }
.toast.show { opacity: .95; }
.update { position: fixed; top: 0; left: 0; right: 0; background: var(--accent); color: var(--on-accent); text-align:center; padding: calc(10px + env(safe-area-inset-top)) 10px 10px; font-weight: 700; z-index: 60; font-size: 14px; }
textarea.in { min-height: 90px; font-size: 13px; }
.seg { display:flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex:1; padding: 6px 4px; border-radius: 8px; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display:none; }
.sheet-bg.show { display:block; }
.sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto;
  background: var(--page); border-radius: 20px 20px 0 0; z-index: 45; padding: 14px 14px calc(20px + env(safe-area-inset-bottom)); display:none; }
.sheet.show { display:block; }
.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; }
.sheet-head h3 { font-size: 17px; }
.macros { display:grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.macro .n { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.macro .n small { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; }
.macro .k { font-size: 13px; color: var(--ink2); font-weight: 600; margin-top: 1px; }
.macro .bar { margin: 6px 0 0; height: 7px; }
.unit { display:inline-flex; background: var(--sunken); border-radius: 99px; padding: 2px; }
.unit button { padding: 5px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); }
.unit button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.conv { font-size: 12px; color: var(--muted); text-align: right; margin-top: 3px; min-height: 16px; }
.ai-btns { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.act3 { display:grid; grid-template-columns: 1fr 1fr 1fr; text-align:center; }
.act3 .n { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.act3 .k { font-size: 12px; color: var(--muted); }
details.how summary { cursor:pointer; font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 10px; }
details.how ol { font-size: 13px; line-height: 1.7; color: var(--ink2); padding-left: 20px; margin-top: 6px; }
code { font-size: 12px; background: var(--sunken); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.cheer { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, var(--surface)), color-mix(in srgb, var(--avg) 12%, var(--surface))); }
details.guide { border-top: 1px solid var(--hair); padding: 10px 0 2px; }
details.guide:first-of-type { border-top: none; }
details.guide summary { font-size: 15px; color: var(--ink); margin-top: 0; }
details.guide ul { font-size: 14px; line-height: 1.75; color: var(--ink2); padding-left: 20px; margin: 6px 0 4px; }
details.guide li { margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><h1>💪 加油日記</h1><span class="date" id="today"></span></div>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetBg" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>

<script>
const BUILD = '20261026e';
const KEY = 'pen-log-v1';

// 台灣常見 GLP-1 瘦瘦筆。half=半衰期(小時), tmax=到達高峰(小時), 只用來畫「粗估」曲線
const DRUGS = {
  tirz:   { name: '猛健樂 Mounjaro', gen: 'tirzepatide', half: 120, tmax: 24, interval: 7 },
  wegovy: { name: '週纖達 Wegovy', gen: 'semaglutide', half: 168, tmax: 48, interval: 7 },
  ozem:   { name: '胰妥讚 Ozempic', gen: 'semaglutide', half: 168, tmax: 48, interval: 7 },
  saxen:  { name: '善纖達 Saxenda', gen: 'liraglutide', half: 13, tmax: 11, interval: 1 },
  other:  { name: '其他', gen: '', half: 0, tmax: 0, interval: 7 },
};
const DOSES = [2.5, 5, 7.5, 10, 12.5, 15];
const SITES = [
  ['abdL', '腹部', '左側'], ['abdR', '腹部', '右側'],
  ['thL', '大腿', '左'], ['thR', '大腿', '右'],
  ['armL', '上臂', '左'], ['armR', '上臂', '右'],
];
const FX = ['噁心', '嘔吐', '便秘', '腹瀉', '脹氣', '胃食道逆流', '沒胃口', '疲倦', '頭痛', '頭暈', '掉髮', '注射處紅腫', '都很好 👍'];
const MEALS = ['早餐', '午餐', '晚餐', '點心'];
const NUTS = [['kcal', '卡路里', '大卡', '🔥'], ['protein', '蛋白質', 'g', '🐟'], ['carb', '碳水', 'g', '🍚'], ['fat', '脂肪', 'g', '💧'], ['fiber', '纖維', 'g', '🌿']];
const AI_PROMPT = `請根據我附上的食物照片(或文字描述),估計這一餐的營養成分。
只回覆一段 JSON,不要任何其他文字:
{"name":"食物名稱","kcal":熱量大卡,"protein":蛋白質克,"carb":碳水克,"fat":脂肪克,"fiber":纖維克}
數字只填數字。如果有好幾樣食物請全部加總,name 用頓號列出。份量看不出來就用台灣常見的一般份量估計。`;

// ---------- 資料 ----------
function blank() {
  return {
    settings: { height: null, startWeight: null, goalWeight: null, goalDate: null, drug: 'tirz', interval: 7, penDoses: 4,
      kcalGoal: 1500, proteinGoal: null, carbGoal: 100, fatGoal: 50, fiberGoal: 25, waterGoal: 2000, sleepGoal: 7, stepsGoal: 8000,
      hkKey: '', hkLast: null, theme: 'auto',
      shotDow: 1, shotTime: '21:00', docOn: true, docTime: '19:00', docName: '' },
    visits: [],
    weights: [], heights: [], shots: [], foods: [], daily: {}, customSites: [], purchases: [], supps: [], activePen: null,
  };
}
let S;
function load() {
  try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); }
  catch (e) { S = blank(); }
  S.settings = Object.assign(blank().settings, S.settings);
  if (!S.heights.length && S.settings.height) S.heights.push({ id: uid(), ts: Date.now(), cm: S.settings.height });
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('儲存失敗:' + e.message); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// ---------- 小工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const DAY = 86400000;
const WD = '日一二三四五六';
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fmtDate(ts) { const d = new Date(ts); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; }
function fmtFull(ts) { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }
function fmtDT(ts) { const d = new Date(ts); return `${fmtDate(ts)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toInput(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const r0 = n => Math.round(n || 0);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2000); }
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const weightsSorted = () => [...S.weights].sort((a, b) => a.ts - b.ts);
const shotsSorted = () => [...S.shots].sort((a, b) => a.ts - b.ts);
const latestWeight = () => { const w = weightsSorted(); return w[w.length - 1] || null; };
const latestOf = k => { const w = weightsSorted().filter(x => x[k] != null); return w[w.length - 1] || null; };
const lastShot = () => { const s = shotsSorted(); return s[s.length - 1] || null; };
const startWeight = () => S.settings.startWeight ?? (weightsSorted()[0]?.kg ?? null);
const heightNow = () => { const h = [...S.heights].sort((a, b) => a.ts - b.ts); return h.length ? h[h.length - 1].cm : S.settings.height; };
function bmi(kg) { const h = heightNow(); return h && kg ? kg / ((h / 100) ** 2) : null; }
function bmiTag(b) { // 衛福部國健署成人 BMI 標準
  if (b == null) return '';
  if (b < 18.5) return '<span class="pill warn">過輕</span>';
  if (b < 24) return '<span class="pill ok">正常</span>';
  if (b < 27) return '<span class="pill warn">過重</span>';
  return '<span class="pill bad">肥胖</span>';
}
function dayData(k) { return S.daily[k] || (S.daily[k] = { water: 0, fx: [] }); }
const today = () => dayData(dayKey(Date.now()));
function proteinGoal() { const g = S.settings.proteinGoal; if (g) return g; const w = S.settings.goalWeight || latestWeight()?.kg; return w ? Math.round(w * 1.2) : 80; }
function goalOf(k) { return k === 'protein' ? proteinGoal() : S.settings[k + 'Goal'] || 0; }
function foodsOn(k) { return S.foods.filter(f => dayKey(f.ts) === k).sort((a, b) => a.ts - b.ts); }
function nutTotals(k) { const t = { kcal: 0, protein: 0, carb: 0, fat: 0, fiber: 0 }; for (const f of foodsOn(k)) for (const n in t) t[n] += f[n] || 0; return t; }

// 下次施打
const weekly = () => (S.settings.interval || 7) === 7;
function atTime(ts, hhmm) { const d = new Date(ts); const [h, m] = String(hhmm || '21:00').split(':').map(Number); d.setHours(h || 0, m || 0, 0, 0); return d.getTime(); }
// 最近一次「排定的打針時間」(<= 現在)
function lastScheduled(now = Date.now()) {
  const d = new Date(now); const back = (d.getDay() - S.settings.shotDow + 7) % 7;
  let t = atTime(now - back * DAY, S.settings.shotTime);
  if (t > now) t -= 7 * DAY;
  return t;
}
function nextShot() {
  const ls = lastShot(), now = Date.now();
  let due;
  if (weekly()) {
    const prev = lastScheduled(now), next = prev + 7 * DAY;
    // 排定時間前 3 天內(或之後)打過,就算那一次打過了
    if (!ls) due = startOfDay(prev) === startOfDay(now) ? prev : next;
    else if (ls.ts >= next - 3 * DAY) due = next + 7 * DAY;
    else if (ls.ts >= prev - 3 * DAY) due = next;
    else due = prev;
  } else {
    if (!ls) return null;
    due = atTime(ls.ts + (S.settings.interval || 1) * DAY, S.settings.shotTime);
  }
  return { due, days: Math.round((startOfDay(due) - startOfDay(now)) / DAY) };
}
// 回診:每月月底(這個月已回診過就算下個月)
function monthEnd(y, m) { return atTime(new Date(y, m + 1, 0).getTime(), S.settings.docTime); }
function nextDoctor() {
  if (!S.settings.docOn) return null;
  const now = new Date(); let y = now.getFullYear(), m = now.getMonth();
  const visited = S.visits.some(v => { const d = new Date(v.ts); return d.getFullYear() === y && d.getMonth() === m; });
  let due = monthEnd(y, m);
  if (visited || due < Date.now() - DAY) { m++; due = monthEnd(y, m); }
  return { due, days: Math.round((startOfDay(due) - startOfDay(Date.now())) / DAY) };
}
const WDN = ['日', '一', '二', '三', '四', '五', '六'];
function allSites() { return [...SITES, ...S.customSites.map(c => [c.id, c.name, ''])]; }
function siteUsedAt() { const u = {}; for (const s of S.shots) if (s.site && (!u[s.site] || s.ts > u[s.site])) u[s.site] = s.ts; return u; }
function suggestSite() {
  const used = siteUsedAt(), last = lastShot()?.site;
  return allSites().map(x => x[0]).filter(id => id !== last).sort((a, b) => (used[a] || 0) - (used[b] || 0))[0];
}
function siteName(id) { const s = allSites().find(x => x[0] === id); return s ? s[1] + s[2] : (S.shots.find(x => x.site === id && x.siteName)?.siteName || ''); }

// 粗估體內藥量(線性吸收到高峰後指數衰退)
function levelAt(t) {
  let sum = 0;
  for (const s of S.shots) {
    const d = DRUGS[s.drug]; if (!d || !d.half || !(s.dose > 0)) continue;
    const h = (t - s.ts) / 3600000; if (h < 0) continue;
    sum += h < d.tmax ? s.dose * h / d.tmax : s.dose * Math.pow(0.5, (h - d.tmax) / d.half);
  }
  return sum;
}
function movingAvg(pts, days = 7) {
  return pts.map(p => { const win = pts.filter(q => q.x <= p.x && q.x > p.x - days * DAY); return { x: p.x, y: win.reduce((a, q) => a + q.y, 0) / win.length }; });
}

// 預計達標:用近 4 週(不足就用全部)體重做線性回歸
function projection() {
  const goal = S.settings.goalWeight, ws = weightsSorted();
  if (!goal || ws.length < 2) return null;
  let pts = ws.filter(w => w.ts > Date.now() - 28 * DAY);
  if (pts.length < 3 || pts[pts.length - 1].ts - pts[0].ts < 7 * DAY) pts = ws.slice(-20);
  const n = pts.length, mx = pts.reduce((a, p) => a + p.ts, 0) / n, my = pts.reduce((a, p) => a + p.kg, 0) / n;
  let sxy = 0, sxx = 0; for (const p of pts) { sxy += (p.ts - mx) * (p.kg - my); sxx += (p.ts - mx) ** 2; }
  if (!sxx) return null;
  const slope = sxy / sxx; // kg / ms
  const cur = movingAvg(ws.map(w => ({ x: w.ts, y: w.kg }))).pop().y;
  const res = { cur, weekly: -slope * 7 * DAY, left: cur - goal };
  if (res.left <= 0) res.done = true;
  else if (slope < 0) res.eta = Date.now() + res.left / -slope;
  if (S.settings.goalDate) {
    const gd = new Date(S.settings.goalDate + 'T00:00').getTime(), wk = (gd - Date.now()) / (7 * DAY);
    res.goalDate = gd; res.needWeekly = wk > 0 ? res.left / wk : null;
  }
  return res;
}
function projHtml(p, compact) {
  if (!p) return '';
  if (p.done) return '<div class="sub" style="margin-top:8px">🎉 7 日平均已達目標</div>';
  let h = p.eta ? `📅 照目前速度(每週 −${f1(p.weekly)} kg),預計 <b>${fmtFull(p.eta)}</b> 達標,約 ${Math.ceil((p.eta - Date.now()) / (7 * DAY))} 週`
    : '📅 最近體重沒有下降趨勢,還算不出預計達標日';
  if (p.goalDate) h += p.needWeekly != null ? `<br>🎯 想在 ${fmtFull(p.goalDate)} 達標:每週需減 <b>${f1(p.needWeekly)} kg</b>${p.eta ? (p.eta <= p.goalDate ? ' <span class="pill ok">來得及</span>' : ' <span class="pill warn">要加油</span>') : ''}` : `<br>🎯 目標日 ${fmtFull(p.goalDate)} 已過`;
  return `<div class="sub" style="margin-top:8px;line-height:1.7">${h}</div>`;
}

// ---------- 圖表(canvas 手繪) ----------
function setupCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr);
  c.font = '11px system-ui, -apple-system, sans-serif'; return { c, W, H };
}
function yGrid(c, L, R, W, Y, lo, hi, yFmt) {
  c.strokeStyle = css('--grid'); c.fillStyle = css('--muted'); c.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    c.beginPath(); c.moveTo(L, y); c.lineTo(W - R, y); c.stroke();
    c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(yFmt(v), L - 5, y);
  }
}
function drawChart(cv, { series, x0, x1, markers = [], yFmt = v => v.toFixed(0), goal = null, zero = false }) {
  const { c, W, H } = setupCanvas(cv);
  const all = series.flatMap(s => s.pts.map(p => p.y)); if (goal != null) all.push(goal);
  if (!all.length) return;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const padY = (hi - lo) * 0.12; lo -= padY; hi += padY; if (zero) lo = 0;
  if (x1 - x0 < DAY) { x0 -= DAY / 2; x1 += DAY / 2; }
  const L = 38, R = 10, T = 10, B = markers.length ? 40 : 24;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (hi - y) / (hi - lo) * (H - T - B);
  yGrid(c, L, R, W, Y, lo, hi, yFmt);
  c.textAlign = 'center'; c.textBaseline = 'top';
  const n = Math.min(5, Math.max(2, Math.floor((W - L) / 70)));
  for (let i = 0; i <= n; i++) { const t = x0 + (x1 - x0) * i / n, d = new Date(t); c.fillText(`${d.getMonth() + 1}/${d.getDate()}`, Math.min(W - R - 12, Math.max(L + 12, X(t))), H - B + 5); }
  if (goal != null) {
    c.setLineDash([4, 4]); c.strokeStyle = css('--ok'); c.beginPath(); c.moveTo(L, Y(goal)); c.lineTo(W - R, Y(goal)); c.stroke(); c.setLineDash([]);
    c.fillStyle = css('--ok'); c.textAlign = 'left'; c.textBaseline = 'bottom'; c.fillText('目標 ' + yFmt(goal), L + 4, Y(goal) - 2);
  }
  for (const s of series) {
    if (!s.pts.length) continue;
    c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.width || 2; c.lineJoin = 'round';
    if (s.fill) {
      c.beginPath(); c.moveTo(X(s.pts[0].x), Y(lo)); s.pts.forEach(p => c.lineTo(X(p.x), Y(p.y)));
      c.lineTo(X(s.pts[s.pts.length - 1].x), Y(lo)); c.closePath(); c.globalAlpha = .15; c.fill(); c.globalAlpha = 1;
    }
    if (s.line !== false) { c.beginPath(); s.pts.forEach((p, i) => i ? c.lineTo(X(p.x), Y(p.y)) : c.moveTo(X(p.x), Y(p.y))); c.stroke(); }
    if (s.dots) s.pts.forEach(p => { c.beginPath(); c.arc(X(p.x), Y(p.y), s.dots, 0, 7); c.fill(); });
  }
  if (Date.now() > x0 && Date.now() < x1) { const nx = X(Date.now()); c.strokeStyle = css('--muted'); c.setLineDash([2, 3]); c.beginPath(); c.moveTo(nx, T); c.lineTo(nx, H - B); c.stroke(); c.setLineDash([]); }
  c.fillStyle = css('--shot'); c.textAlign = 'center'; c.textBaseline = 'top'; c.font = '10px system-ui, sans-serif';
  let lastX = -99;
  for (const m of markers) {
    const mx = X(m.x); if (mx < L - 1 || mx > W - R + 1) continue;
    c.beginPath(); c.moveTo(mx, H - B + 20); c.lineTo(mx - 4, H - B + 27); c.lineTo(mx + 4, H - B + 27); c.fill();
    if (mx - lastX > 26) { c.fillText(m.label, mx, H - B + 28); lastX = mx; }
  }
}
// 每日長條圖
function drawBars(cv, { bars, goal, color, yFmt = v => v.toFixed(0) }) {
  const { c, W, H } = setupCanvas(cv);
  const vals = bars.map(b => b.y || 0); if (goal) vals.push(goal);
  const hi = Math.max(...vals, 1) * 1.12, lo = 0;
  const L = 38, R = 8, T = 8, B = 22;
  const Y = y => T + (hi - y) / (hi - lo) * (H - T - B);
  yGrid(c, L, R, W, Y, lo, hi, yFmt);
  const bw = (W - L - R) / bars.length;
  c.textAlign = 'center'; c.textBaseline = 'top';
  bars.forEach((b, i) => {
    const x = L + i * bw;
    if (b.y) { c.fillStyle = color; c.globalAlpha = goal && b.y < goal ? .55 : 1; c.beginPath(); c.roundRect(x + bw * .18, Y(b.y), bw * .64, Y(0) - Y(b.y), 3); c.fill(); c.globalAlpha = 1; }
    if (bars.length <= 14 || i % Math.ceil(bars.length / 10) === 0) { c.fillStyle = css('--muted'); c.fillText(b.label, x + bw / 2, H - B + 5); }
  });
  if (goal) { c.setLineDash([4, 4]); c.strokeStyle = css('--ok'); c.beginPath(); c.moveTo(L, Y(goal)); c.lineTo(W - R, Y(goal)); c.stroke(); c.setLineDash([]); }
}

      <div class="stat"><div class="k">這支筆剩</div><div class="n">${penStatus() ? penStatus().left : '—'}<small>mg${penStatus()?.doses != null ? ` · 可打 ${penStatus().doses} 次` : ''}</small></div></div>
    </div>
    ${lv > 0.01 ? `<div class="note">估計體內藥量約 ${lv.toFixed(2)} mg(依半衰期粗估,只供參考)</div>` : ''}

      ${lv2 ? `<div class="sub">上次 ${fmtFull(lv2.ts)}${lv2.note ? ' · ' + esc(lv2.note) : ''}</div>` : '<div class="sub">記得帶這個月的體重紀錄給醫師看</div>'}</div>
      ${nd.days > 0 ? `<span class="pill ${nd.days <= 3 ? 'warn' : ''}">還有 ${nd.days} 天</span>` : nd.days === 0 ? '<span class="pill warn">今天回診</span>' : `<span class="pill bad">已過 ${-nd.days} 天</span>`}</div>
      <button class="btn ghost block" style="margin-top:12px" data-act="visit">✓ 已回診,記一下</button></div>`;

  // 飲食
  const k = dayKey(Date.now()), tt = nutTotals(k), td = today(), fl = foodsOn(k);
  h += `<div class="card"><h2>飲食</h2><div class="macros">
    ${NUTS.slice(1).map(([n, t, u, ic]) => `<div class="macro"><div class="n">${r0(tt[n])}<small>/ ${goalOf(n)}${u}</small></div><div class="k">${ic} ${t}</div>${bar(tt[n], goalOf(n), n === 'protein' ? 'var(--avg)' : '')}</div>`).join('')}</div>
    <div class="between" style="margin-top:14px"><b>🔥 卡路里</b><b style="font-size:18px">${r0(tt.kcal)} / ${goalOf('kcal')}</b></div>${bar(tt.kcal, goalOf('kcal'), tt.kcal > goalOf('kcal') ? 'var(--bad)' : '')}
    ${fl.length ? `<div class="list" style="margin-top:8px">${fl.map(f => `<div class="item"><div class="grow"><div class="v" style="font-weight:600">${esc(f.name || '未命名')}</div><div class="t">${f.meal} · ${r0(f.kcal)} 大卡 · 蛋白質 ${r0(f.protein)} g</div></div><button class="x" data-act="delFood" data-id="${f.id}">✕</button></div>`).join('')}</div>` : ''}
    <button class="btn block" style="margin-top:12px" data-act="openFood">📷 ＋ 記錄飲食</button></div>`;
  // 喝水
  const wg = goalOf('water');

    <button class="btn ghost" data-act="add" data-k="water" data-v="-250">−</button>

  h += `<div class="card"><h2>活動與睡眠 <small>${S.settings.hkKey ? (S.settings.hkLast ? '健康資料 ' + fmtDT(S.settings.hkLast) : '尚未收到健康資料') : '<a href="#" data-act="goHk" style="color:var(--accent)">連動 iPhone 健康 ›</a>'}</small></h2>

    <div class="note">嚴重腹痛(痛到背後)、持續嘔吐無法進食喝水、皮膚眼白變黃,請盡快就醫。</div></div>`;
  h += guideCard('📖 打針與飲食注意事項');

}

// ---------- 藥物記錄:施打 / 筆與花費 / 營養品 ----------
const money = n => 'NT$ ' + Math.round(n || 0).toLocaleString();
function penTotal(id) { return S.shots.filter(s => s.penId === id).reduce((a, s) => a + (s.dose || 0), 0); }
function penStatus() {
  const p = S.purchases.find(x => x.id === S.activePen?.id); if (!p) return null;
  const used = penTotal(p.id), left = Math.max(0, Math.round((p.totalMg - used) * 100) / 100);
  const usual = lastShot()?.dose || p.mgPerDose;
  return { p, used, left, n: S.shots.filter(s => s.penId === p.id).length, doses: usual ? Math.floor(left / usual + 1e-9) : null, usual };
}
function usedValue() { return S.shots.reduce((a, x) => { const p = S.purchases.find(q => q.id === x.penId); return a + (p && p.totalMg ? (x.dose || 0) * p.price / p.totalMg : 0); }, 0); }
function spend() {
  const pens = S.purchases.reduce((a, p) => a + (p.price || 0), 0), supps = S.supps.reduce((a, p) => a + (p.price || 0), 0);
  const mg = S.purchases.reduce((a, p) => a + (p.totalMg || 0), 0);
  return { pens, supps, mg, all: pens + supps };
}

function viewMed() {
  const seg = `<div class="seg" style="margin-bottom:12px">${[['shot', '💉 施打'], ['pen', '🖊️ 筆與花費'], ['supp', '💊 營養品']].map(([v, t]) => `<button data-act="medSeg" data-v="${v}" class="${ui.medSeg === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  return seg + ({ shot: viewShot, pen: viewPen, supp: viewSupp })[ui.medSeg]();
}

    <div class="between" style="margin-top:12px"><b>從頭到尾總共</b><b style="font-size:22px;color:var(--accent)">${money(sp.all)}</b></div>
    ${lost > 0.5 && sp.pens ? `<div class="note">目前減了 ${f1(lost)} kg,平均每減 1 公斤花 ${money(sp.pens / lost)}(只算筆)。</div>` : ''}</div>`;
  const pp = ui.penForm;
  h += `<div class="card"><h2>＋ 記錄買筆</h2>
    <div class="grid2"><div><label class="f">購買日期</label><input class="in" id="pDate" type="date" value="${dayKey(Date.now())}"></div>
    <div><label class="f">金額 NT$</label><input class="in" id="pPrice" type="number" inputmode="numeric" placeholder="例如 6000"></div></div>
    <label class="f">筆的劑量(每劑)</label>
    <div class="chips">${DOSES.map(x => `<button class="chip ${pp.mg === x ? 'on' : ''}" data-act="pMg" data-v="${x}">${x} mg</button>`).join('')}</div>

    <label class="f">在哪買(選填)</label><input class="in" id="pPlace" placeholder="例如:○○診所">

function medClick(act, b, v) {
  if (act === 'medSeg') { ui.medSeg = v; render(); return true; }
  if (act === 'addSite') {
    const n = (prompt('新增注射部位名稱(例如:臀部左、腰側右):') || '').trim(); if (!n) return true;
    const id = 'c' + uid(); S.customSites.push({ id, name: n }); ui.site = id; save(); render(); return true;
  }
  if (act === 'delSite') {
    const c = S.customSites.find(x => x.id === b.dataset.id);
    if (c && confirm(`刪除自訂部位「${c.name}」?(舊紀錄仍會保留名稱)`)) { S.customSites = S.customSites.filter(x => x !== c); if (ui.site === c.id) ui.site = null; save(); render(); }
    return true;
  }
  if (act === 'pMg') { ui.penForm.mg = +v; ui.penForm.doses = num($('#pDoses').value) || 4; render(); return true; }
  if (act === 'savePen') {
    const doses = num($('#pDoses').value) || 4, total = num($('#pTotal').value) || ui.penForm.mg * doses;
    const qty = Math.max(1, Math.round(num($('#pQty').value) || 1)), price = num($('#pPrice').value);
    const ts = new Date($('#pDate').value + 'T12:00').getTime() || Date.now();
    if (price == null) return toast('請填金額'), true;
    let firstId;
    for (let i = 0; i < qty; i++) {
      const id = uid() + i; firstId = firstId || id;
      S.purchases.push({ id, ts, mgPerDose: ui.penForm.mg, doses, totalMg: total, price: price / qty, place: $('#pPlace').value.trim() });
    }
    if ($('#pUse').checked) S.activePen = { id: firstId, since: Date.now() };
    save(); render(); toast(qty > 1 ? `已記錄 ${qty} 支` : '已記錄'); return true;
  }
  if (act === 'usePen') { S.activePen = { id: b.dataset.id, since: Date.now() }; save(); render(); toast('已設為使用中'); return true; }
  if (act === 'endPen') { const p = S.purchases.find(x => x.id === S.activePen?.id); if (p) p.done = true; S.activePen = null; save(); render(); return true; }
  if (act === 'adjPen') {
    const ps = penStatus(); const n = num(prompt('實際還剩幾 mg?', ps.left)); if (n == null) return true;
    ps.p.totalMg = Math.round((ps.used + n) * 100) / 100; save(); render(); return true;
  }
  if (act === 'delPen') {
    if (!confirm('刪除這筆買筆紀錄?')) return true;
    S.purchases = S.purchases.filter(p => p.id !== b.dataset.id); if (S.activePen?.id === b.dataset.id) S.activePen = null; save(); render(); return true;
  }
  if (act === 'saveSupp') {
    const name = $('#uName').value.trim(), price = num($('#uPrice').value);
    if (!name || price == null) return toast('請填品名和金額'), true;
    S.supps.push({ id: uid(), ts: new Date($('#uDate').value + 'T12:00').getTime() || Date.now(), name, qty: $('#uQty').value.trim(), price, place: $('#uPlace').value.trim() });
    save(); render(); toast('已記錄'); return true;
  }
  if (act === 'delSupp') { if (confirm('刪除這筆營養品紀錄?')) { S.supps = S.supps.filter(s => s.id !== b.dataset.id); save(); render(); } return true; }
  return false;
}

    <div class="grid2"><div><label class="f">📏 腰圍 cm(選填)</label><input class="in" id="wWaist" type="number" inputmode="decimal" step="0.1"></div>

    <div class="t">${fmtDT(w.ts)}${w.fat != null ? ` · 體脂 ${f1(w.fat)}%` : ''}${w.muscle != null ? ` · 骨骼肌 ${f1(w.muscle)} kg` : ''}${w.waist != null ? ` · 腰圍 ${w.waist}` : ''}</div></div>

  const hs = [...S.heights].sort((a, b) => b.ts - a.ts);

function lastNDays(n) { const out = []; for (let i = n - 1; i >= 0; i--) { const t = startOfDay(Date.now()) - i * DAY; const d = new Date(t); out.push({ k: dayKey(t), label: `${d.getMonth() + 1}/${d.getDate()}` }); } return out; }

function viewStats() {
  const ws = weightsSorted(), ss = shotsSorted();
  let h = `<div class="seg" style="margin-bottom:12px">${[[30, '1 個月'], [90, '3 個月'], [180, '半年'], [0, '全部']].map(([v, t]) => `<button data-act="range" data-v="${v}" class="${ui.range === v ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  const sw = startWeight(), lw = ws[ws.length - 1];
  const first = Math.min(ws[0]?.ts ?? Infinity, ss[0]?.ts ?? Infinity);
  const weeks = isFinite(first) ? (Date.now() - first) / (7 * DAY) : 0;
  const p = projection();
  const pctRate = p && lw ? p.weekly / lw.kg * 100 : null;
  h += `<div class="card"><h2>總覽</h2><div class="stats">
    <div class="stat"><div class="k">累計減少</div><div class="n">${sw != null && lw ? f1(sw - lw.kg) : '—'}<small>kg</small></div></div>
    <div class="stat"><div class="k">開始至今</div><div class="n">${weeks ? Math.floor(weeks) : '—'}<small>週</small></div></div>
    <div class="stat"><div class="k">近期每週減</div><div class="n">${p ? f1(p.weekly) : '—'}<small>kg</small></div></div>
    <div class="stat"><div class="k">預計達標</div><div class="n" style="font-size:16px;padding-top:4px">${p?.done ? '已達標 🎉' : p?.eta ? fmtFull(p.eta) : '—'}</div></div>
  </div>${projHtml(p)}${pctRate != null && pctRate > 0 ? `<div class="note">${pctRate > 1.5 ? '⚠️ 每週減超過體重 1.5%,速度偏快,記得吃夠蛋白質、注意肌肉流失。' : pctRate >= 0.5 ? '👍 每週減 0.5–1.5% 體重,屬於穩定的速度。' : '近期變化較慢,可能是平台期,可以和醫師討論。'}</div>` : ''}</div>`;
  if (ws.length) h += `<div class="card"><h2>體重趨勢</h2><canvas class="chart" id="cWeight"></canvas>
    <div class="legend"><span><i style="background:var(--weight)"></i>每次量測</span><span><i style="background:var(--avg)"></i>7 日平均</span><span><i style="background:var(--shot)"></i>施打 (mg)</span></div></div>`;
  if (ws.some(w => w.fat != null || w.muscle != null)) h += `<div class="card"><h2>體組成 <small>體脂肪 kg / 骨骼肌 kg</small></h2><canvas class="chart" id="cComp" style="height:180px"></canvas>
    <div class="legend"><span><i style="background:var(--bad)"></i>體脂肪</span><span><i style="background:var(--shot)"></i>骨骼肌</span></div><div class="note">減重時骨骼肌盡量維持不掉,代表減的是脂肪。</div></div>`;
  if (ss.some(s => DRUGS[s.drug]?.half)) h += `<div class="card"><h2>估計體內藥量 <small>mg,含未來 7 天</small></h2><canvas class="chart" id="cLevel" style="height:170px"></canvas>
    <div class="note">用藥品半衰期粗略推算,不是實際血中濃度,只用來看「打完哪幾天藥效比較強」。</div></div>`;
  // 飲食、睡眠、步數:近 14 天
  const days = lastNDays(14);
  const avg = arr => { const v = arr.filter(x => x != null && x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const kc = days.map(d => nutTotals(d.k)), sl = days.map(d => S.daily[d.k]?.sleep ?? null), stp = days.map(d => S.daily[d.k]?.steps ?? null);
  const aK = avg(kc.map(x => x.kcal)), aP = avg(kc.map(x => x.protein)), aS = avg(sl), aT = avg(stp);
  h += `<div class="card"><h2>近 14 天平均</h2><div class="stats">
    <div class="stat"><div class="k">🔥 熱量</div><div class="n">${aK ? r0(aK) : '—'}<small>大卡</small></div></div>
    <div class="stat"><div class="k">🐟 蛋白質</div><div class="n">${aP ? r0(aP) : '—'}<small>/ ${proteinGoal()} g</small></div></div>
    <div class="stat"><div class="k">😴 睡眠</div><div class="n">${aS ? f1(aS) : '—'}<small>小時</small></div></div>
    <div class="stat"><div class="k">👣 步數</div><div class="n">${aT ? r0(aT).toLocaleString() : '—'}<small>步</small></div></div></div><div class="note">只算有記錄的天數。</div></div>`;
  if (aS) h += `<div class="card"><h2>每日睡眠 <small>小時,虛線 = 目標 ${S.settings.sleepGoal}</small></h2><canvas class="chart" id="cSleep" style="height:160px"></canvas></div>`;
  if (aT) h += `<div class="card"><h2>每日步數 <small>虛線 = 目標 ${goalOf('steps').toLocaleString()}</small></h2><canvas class="chart" id="cSteps" style="height:160px"></canvas></div>`;
  if (aP) h += `<div class="card"><h2>每日蛋白質 <small>g,虛線 = 目標</small></h2><canvas class="chart" id="cProt" style="height:160px"></canvas></div>`;
  const from = ui.range ? Date.now() - ui.range * DAY : 0;
  const cnt = {}; let fd = 0;
  for (const [k, v] of Object.entries(S.daily)) { if (new Date(k + 'T00:00').getTime() < from - DAY || !v.fx?.length) continue; fd++; v.fx.forEach(f => cnt[f] = (cnt[f] || 0) + 1); }
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  if (top.length) h += `<div class="card"><h2>身體狀況 <small>有記錄的 ${fd} 天中</small></h2><div class="list">${top.map(([f, n]) => `<div class="item"><div class="grow">${esc(f)}</div><div class="v">${n} 天</div></div>`).join('')}</div></div>`;
  const steps = []; for (const s of ss) { const l = steps[steps.length - 1]; if (!l || l.dose !== s.dose || l.drug !== s.drug) steps.push({ dose: s.dose, drug: s.drug, ts: s.ts, n: 1 }); else l.n++; }
  if (steps.length) h += `<div class="card"><h2>劑量歷程</h2><div class="list">${steps.reverse().map(s => `<div class="item"><div class="grow"><div class="v">${s.dose ?? '?'} mg</div><div class="t">${fmtDate(s.ts)} 起 · ${esc(DRUGS[s.drug]?.name || '')}</div></div><div class="sub">${s.n} 次</div></div>`).join('')}</div></div>`;
  if (!ws.length && !ss.length && !aK && !aS && !aT) h += '<div class="card"><div class="empty">有了紀錄之後,這裡會出現趨勢圖。</div></div>';
  return h;
}

function openFood() {

  ui.food = { ts: Date.now(), meal: h < 10 ? '早餐' : h < 14 ? '午餐' : h < 17 ? '點心' : '晚餐', name: '', kcal: '', protein: '', carb: '', fat: '', fiber: '', serv: 1 };

}

function readFoodForm() {
  const f = ui.food; if (!f) return;
  f.name = $('#fName').value; f.ts = new Date($('#fTs').value).getTime() || f.ts; f.meal = $('#fMeal .on')?.dataset.v || f.meal;
  document.querySelectorAll('[data-nut]').forEach(i => f[i.dataset.nut] = i.value);
}
function parseAI(text) {
  const m = String(text).match(/\{[\s\S]*?\}/); if (!m) throw new Error('找不到 { } 格式的內容');
  let o; try { o = JSON.parse(m[0].replace(/[“”]/g, '"').replace(/,\s*}/, '}')); } catch (e) { throw new Error('格式看不懂'); }
  const pick = (...ks) => { for (const k of ks) if (o[k] != null) { const n = num(String(o[k]).replace(/[^\d.]/g, '')); if (n != null) return n; } return ''; };
  return { name: o.name || o['名稱'] || o.food || '', kcal: pick('kcal', 'calories', '熱量', '卡路里'), protein: pick('protein', '蛋白質'), carb: pick('carb', 'carbs', 'carbohydrate', '碳水', '碳水化合物'), fat: pick('fat', '脂肪'), fiber: pick('fiber', '纖維') };
}
function applyAI(text) {
  try { readFoodForm(); Object.assign(ui.food, parseAI(text)); renderSheet(); toast('已帶入 AI 估算,確認後按儲存'); }
  catch (e) { toast('讀不到:' + e.message); }
}

// ---------- iPhone 健康(經捷徑 → Firebase) ----------
async function syncHealth(manual) {
  const base = (S.settings.hkKey || '').trim().replace(/\/+$/, ''); if (!base) return manual && toast('請先貼上同步金鑰');
  try {
    const res = await fetch(base + '/pen_health.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? '金鑰沒有權限(是不是舊金鑰?)' : 'HTTP ' + res.status);
    const data = await res.json() || {};
    let n = 0;
    for (const e of Object.values(data)) {
      if (!e || typeof e !== 'object') continue;
      const dm = /^(\d{4})(\d{2})(\d{2})/.exec(String(e.d || '')); let v = num(String(e.v ?? '').replace(/,/g, ''));
      if (!dm || v == null || v < 0) continue;
      const dd = dayData(`${dm[1]}-${dm[2]}-${dm[3]}`);
      if (e.t === 'steps') { v = Math.round(v); if (dd.steps !== v) { dd.steps = v; n++; } }
      else if (e.t === 'sleep') {
        const hrs = Math.round((v > 1440 ? v / 3600 : v > 24 ? v / 60 : v) * 10) / 10; // 秒/分鐘/小時自動判斷
        if (!dd.sleepManual && dd.sleep !== hrs && hrs <= 24) { dd.sleep = hrs; n++; }
      }
    }
    if (Object.keys(data).length) S.settings.hkLast = Date.now();
    save(); if (manual) toast(Object.keys(data).length ? `已同步,更新 ${n} 筆` : '連線成功,但還沒收到捷徑送來的資料');
    if (ui.tab === 'home' || ui.tab === 'stats' || manual) render();
  } catch (e) { if (manual) alert('同步失敗:' + e.message); }
}

function afterRender() {
  if (ui.tab === 'body') convUpdate();
  if (ui.tab !== 'stats') return;
  const from = ui.range ? Date.now() - ui.range * DAY : -Infinity;
  const wsAll = weightsSorted().filter(w => w.ts >= from), ws = wsAll.map(w => ({ x: w.ts, y: w.kg }));
  const ss = shotsSorted().filter(s => s.ts >= from), mk = ss.map(s => ({ x: s.ts, label: s.dose ?? '' }));
  const cw = $('#cWeight');
  if (cw) {
    if (ws.length) {
      const x0 = Math.min(ws[0].x, ss[0]?.ts ?? Infinity), x1 = Math.max(ws[ws.length - 1].x, Date.now()), g = S.settings.goalWeight;
      drawChart(cw, { x0, x1, yFmt: v => v.toFixed(1), goal: g && Math.min(...ws.map(p => p.y)) - g < 8 ? g : null,
        series: [{ pts: ws, color: css('--weight'), width: 1.2, dots: 3, line: ws.length < 40 }, { pts: movingAvg(ws), color: css('--avg'), width: 2.5 }], markers: mk });
    } else cw.outerHTML = '<div class="empty">這段期間沒有體重紀錄</div>';
  }
  const cc = $('#cComp');
  if (cc) {
    const fat = wsAll.filter(w => w.fat != null).map(w => ({ x: w.ts, y: w.fat * w.kg / 100 })), mus = wsAll.filter(w => w.muscle != null).map(w => ({ x: w.ts, y: w.muscle }));
    const xs = [...fat, ...mus].map(p => p.x);
    if (xs.length) drawChart(cc, { x0: Math.min(...xs), x1: Math.max(...xs, Date.now()), yFmt: v => v.toFixed(1), series: [{ pts: fat, color: css('--bad'), dots: 3 }, { pts: mus, color: css('--shot'), dots: 3 }] });
    else cc.outerHTML = '<div class="empty">這段期間沒有體組成紀錄</div>';
  }
  const cl = $('#cLevel');
  if (cl) {
    const all = shotsSorted(), x0 = Math.max(all[0].ts, ui.range ? Date.now() - ui.range * DAY : 0), x1 = Date.now() + 7 * DAY;
    const step = Math.max(3600000, (x1 - x0) / 240), pts = [];
    for (let t = x0; t <= x1; t += step) pts.push({ x: t, y: levelAt(t) });
    drawChart(cl, { x0, x1, zero: true, yFmt: v => v.toFixed(v < 10 ? 1 : 0), series: [{ pts, color: css('--level'), width: 2, fill: true }], markers: mk });
  }
  const days = lastNDays(14);
  const sc = $('#cSleep'); if (sc) drawBars(sc, { bars: days.map(d => ({ label: d.label, y: S.daily[d.k]?.sleep })), goal: S.settings.sleepGoal, color: css('--weight'), yFmt: v => v.toFixed(0) });
  const tc = $('#cSteps'); if (tc) drawBars(tc, { bars: days.map(d => ({ label: d.label, y: S.daily[d.k]?.steps })), goal: goalOf('steps'), color: css('--shot'), yFmt: v => v >= 1000 ? (v / 1000).toFixed(0) + 'k' : v.toFixed(0) });
  const pc = $('#cProt'); if (pc) drawBars(pc, { bars: days.map(d => ({ label: d.label, y: nutTotals(d.k).protein })), goal: proteinGoal(), color: css('--avg') });
}

// 體脂 / 骨骼肌 kg ↔ % 換算提示
function convUpdate() {
  const kg = num($('#wKg')?.value) ?? latestWeight()?.kg;
  const fv = num($('#wFat')?.value), mv = num($('#wMus')?.value);
  if ($('#fatConv')) $('#fatConv').textContent = fv != null && kg ? (ui.fatU === '%' ? `≈ ${f1(fv * kg / 100)} kg` : `≈ ${f1(fv / kg * 100)} %`) : '';
  if ($('#musConv')) $('#musConv').textContent = mv != null && kg ? (ui.musU === 'kg' ? `≈ ${f1(mv / kg * 100)} %` : `≈ ${f1(mv * kg / 100)} kg`) : '';

// ---------- 動作 ----------
function addWeight(rec) {
  if (rec.kg == null || rec.kg < 20 || rec.kg > 400) { toast('體重數字怪怪的,再確認一下'); return false; }
  S.weights.push(Object.assign({ id: uid() }, rec)); save(); toast(weightToast(rec.kg)); return true;
}
function addHeight(cm, ts = Date.now()) {
  if (cm == null) return;
  if (cm < 50 || cm > 250) return toast('身高數字怪怪的');
  if (cm === heightNow()) return;
  S.heights.push({ id: uid(), ts, cm }); save();
}
function localStamp(d) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`; }
function addToCalendar(kind, where) {
  const st = S.settings, tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei';
  let start, title, rrule, alarms;
  if (kind === 'shot') {
    start = new Date(nextShot()?.due ?? lastScheduled() + 7 * DAY);
    title = '💉 該打針囉(加油日記)';
    rrule = weekly() ? `RRULE:FREQ=WEEKLY;BYDAY=${['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][st.shotDow]}` : `RRULE:FREQ=DAILY;INTERVAL=${st.interval || 1}`;
    alarms = ['PT0M'];
  } else {
    const nd = nextDoctor() || { due: monthEnd(new Date().getFullYear(), new Date().getMonth()) };
    start = new Date(nd.due); title = '🩺 回診檢查' + (st.docName ? ' · ' + st.docName : '');
    rrule = 'RRULE:FREQ=MONTHLY;BYMONTHDAY=-1'; alarms = ['-P1D', '-PT2H'];
  }
  const end = new Date(start.getTime() + (kind === 'shot' ? 15 : 60) * 60000);
  if (where === 'g') {
    window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) +
      `&dates=${localStamp(start)}/${localStamp(end)}&ctz=${encodeURIComponent(tz)}&recur=${encodeURIComponent(rrule)}`, '_blank');
  } else {
    download(kind === 'shot' ? '打針提醒.ics' : '回診提醒.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//pen-log//TW', 'BEGIN:VEVENT', `UID:${uid()}@pen-log`,
      `DTSTAMP:${utc(new Date())}`, `DTSTART;TZID=${tz}:${localStamp(start)}`, `DTEND;TZID=${tz}:${localStamp(end)}`, `SUMMARY:${title}`, rrule,
      ...alarms.flatMap(t => ['BEGIN:VALARM', `TRIGGER:${t}`, 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'END:VALARM']), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n'), 'text/calendar');
  }
}
function utc(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyText(t, okMsg) { (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast(okMsg), () => prompt('請手動複製:', t)); }
function restore(text) {
  try {
    const d = JSON.parse(text); if (!d || !Array.isArray(d.weights) || !Array.isArray(d.shots)) throw new Error('格式不對');
    if (!confirm(`要用備份取代目前資料嗎?\n備份內:體重 ${d.weights.length} 筆、施打 ${d.shots.length} 次`)) return;
    localStorage.setItem(KEY, JSON.stringify(d)); load(); save(); applyTheme(); render(); toast('已還原');
  } catch (e) { alert('還原失敗:' + e.message); }
}
async function checkUpdate(manual) {
  try {
    const t = await (await fetch('index.html?x=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) {
      if (!$('.update')) { const b = document.createElement('div'); b.className = 'update'; b.textContent = '有新版本,點這裡更新'; b.onclick = hardReload; document.body.appendChild(b); }
    } else if (manual) toast('已經是最新版');
  } catch (e) { if (manual) toast('連不上網路'); }
}
async function hardReload() {
  try { const rs = await navigator.serviceWorker?.getRegistrations(); for (const r of rs || []) await r.unregister(); for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.reload();
}

  S.settings[k] = v;
  if (k === 'drug') S.settings.interval = DRUGS[v].interval;
  save(); if (k === 'drug' || k === 'docOn') render(); else toast('已儲存');
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'qkg') $('[data-act=quickWeight]').click(); });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(afterRender, 150); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!ui.food) render(); syncHealth(); setTimeout(checkUpdate, 3000); } });

load(); applyTheme(); render(); syncHealth();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
setTimeout(checkUpdate, 3000);
</script>
</body>
